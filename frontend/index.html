<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mystery AI Theater 3000</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="appHeader">
        <button id="miniHeaderToggle" class="secondary" title="Open settings drawer" aria-expanded="false" style="order:-1; min-width:44px; min-height:36px;">🔘</button>
        <h1>🎭 Mystery AI Theater 3000</h1>
        <div class="header-actions">
          <button id="commentNowHeaderBtn" class="secondary" title="Comment Now">💬 Comment Now</button>
          <button id="muteBtnTop" title="Mute/Unmute">🔇 Mute</button>
        </div>
      </header>

      <main>
        <div class="stage">
          <video id="preview" autoplay muted playsinline></video>
          <canvas id="captureCanvas" width="1280" height="720" style="display:none"></canvas>
          <div class="theater">
            <div id="viewer1" class="viewer">🤖</div>
            <div id="viewer2" class="viewer">🤖</div>
          </div>
        </div>

        <div id="stageResizer" class="stage-resizer" aria-label="Resize screenshare" title="Drag to resize"></div>

        <section class="log">
          <h2>Esteemed Viewers</h2>
          <div id="log"></div>
        </section>
      </main>

    <!-- Top drawer: consolidated settings -->
      <div id="settingsDrawer" class="drawer top collapsed">
      <div class="drawer-content">
        <div class="panel">
          <h2>🎬 Capture & Layout</h2>
          <div class="controls-grid">
            <div class="voice-title">🎥 Capture</div>
              <button id="shareBtn">🪟 Share</button>
              <button id="stopBtn" disabled>⏹️ Stop</button>
              <button id="pauseBtn" class="secondary" disabled>⏸️ Pause</button>
              <button id="muteBtn">🔇 Mute</button>
            <label>⏱️ Interval (s)
              <input id="intervalInput" type="number" min="0.5" step="0.5" value="2.5" />
            </label>
            <label>🧠 History (0–100)
              <input id="historyInput" type="number" min="0" max="100" step="1" value="10" />
            </label>
            <label class="inline">👁️ Preview
              <input id="hidePreviewChk" type="checkbox" /> Hide
            </label>
            <button id="settingsSaveBtn" class="secondary" title="Save settings">💾 Save Settings</button>
              <label>⚙️ Mode
                <select id="modeSelect">
                  <option value="interval" selected>Interval</option>
                  <option value="manual">Manual</option>
                </select>
              </label>
              <button id="commentNowBtn" class="secondary" disabled>💬 Comment Now</button>
              <span id="commentStatus" class="status"></span>
          </div>
        </div>

        <div class="panel">
          <h2>🎙️ Voice Settings <button id="voiceRefresh" class="secondary" style="margin-left:8px">🔄 Refresh Voices</button></h2>
          <div class="voice-row">
            <div class="voice-title">Viewer 1</div>
            <label>Voice (Browser)
              <select id="voice1Select"></select>
            </label>
            <label>Voice (ElevenLabs)
              <select id="voice1Eleven"></select>
            </label>
            <label>Pitch
              <input id="voice1Pitch" type="range" min="0.5" max="2" step="0.1" value="1.2" />
              <span id="voice1PitchVal">1.2</span>
            </label>
            <label>Rate
              <input id="voice1Rate" type="range" min="0.5" max="2" step="0.1" value="1.1" />
              <span id="voice1RateVal">1.1</span>
            </label>
            <label>Volume
              <input id="voice1Vol" type="range" min="0" max="1" step="0.05" value="1" />
              <span id="voice1VolVal">1.0</span>
            </label>
            <button id="voice1Test" class="secondary">🧪 Test</button>
          </div>

          <div class="voice-row">
            <div class="voice-title">Viewer 2</div>
            <label>Voice (Browser)
              <select id="voice2Select"></select>
            </label>
            <label>Voice (ElevenLabs)
              <select id="voice2Eleven"></select>
            </label>
            <label>Pitch
              <input id="voice2Pitch" type="range" min="0.5" max="2" step="0.1" value="0.9" />
              <span id="voice2PitchVal">0.9</span>
            </label>
            <label>Rate
              <input id="voice2Rate" type="range" min="0.5" max="2" step="0.1" value="1.1" />
              <span id="voice2RateVal">1.1</span>
            </label>
            <label>Volume
              <input id="voice2Vol" type="range" min="0" max="1" step="0.05" value="1" />
              <span id="voice2VolVal">1.0</span>
            </label>
            <button id="voice2Test" class="secondary">🧪 Test</button>
          </div>
        </div>

        <div class="panel">
          <h2>🎨 Theme</h2>
          <div class="voice-row" style="grid-template-columns: 140px minmax(220px, 2fr);">
            <div class="voice-title">Select Theme</div>
            <label style="grid-template-columns: auto 1fr;">
              Theme
              <select id="themeSelect">
                <option value="default">Default</option>
                <option value="unicorn">Unicorn Rainbow</option>
                <option value="ocean">Ocean</option>
                <option value="sunset">Sunset</option>
                <option value="forest">Forest</option>
                <option value="terminal">Terminal</option>
                <option value="vaporwave">Vaporwave</option>
                <option value="solarized">Solarized</option>
                <option value="mono">Monochrome</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
  </html>
